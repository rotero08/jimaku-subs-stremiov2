name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check that it starts
        run: |
          docker build -t jimaku-subs .
          docker run -d --name addon -p 7000:7000 jimaku-subs
          for i in $(seq 1 20); do
            curl -fsS http://localhost:7000/health && exit 0
            sleep 1
          done
          docker logs addon
          exit 1
